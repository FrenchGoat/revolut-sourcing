name: Emails quotidiens
on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python scraper.py
        env:
          GOOGLE_CREDS: ${{ secrets.GOOGLE_CREDS }}
